[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luma_engine"
version = "1.0.0"
description = "Luma Studio rendering engine: SVG geometry, motion, HDR light compositing, sound design, encoding and QC."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "skia-python==144.0.post2",
  "numpy==2.4.6",
  "opencv-python-headless==5.0.0.93",
  "scipy==1.17.1",
  "shapely==2.1.2",
  "fonttools==4.66.0",
  "uharfbuzz==0.56.2",
  "pillow==12.3.0",
  "pymupdf==1.28.2",
  "cairosvg==2.9.1",
  "pyloudnorm==0.2.0",
  "soundfile==0.14.0",
  "defusedxml==0.7.1",
]

[project.scripts]
luma-engine = "luma_engine.cli:main"

[tool.setuptools.packages.find]
include = ["luma_engine*"]

[tool.setuptools.package-data]
luma_engine = ["assets/*", "templates/*.py"]
