[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luma-studio-backend"
version = "1.0.0"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.1",
  "pydantic==2.13.5",
  "python-multipart==0.0.32",
  "openai==3.19.2",
  "elevenlabs==2.69.0",
  "httpx==0.28.1",
  "cryptography==50.0.1",
  "ptyprocess==0.7.0",
  "websockets==17.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
