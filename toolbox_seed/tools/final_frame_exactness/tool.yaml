name: final_frame_exactness
version: 1.0.0
scope: global
description: >-
  Final-frame exactness QC: decodes the last frame of a video and compares it with the reference end card (the exact
  lockup PNG) — mean and max absolute difference in 8-bit codes, the share of differing pixels and a difference
  heatmap. Passes when the mean difference is within max_mad (default 2/255).
parameters:
  type: object
  properties:
    video: {type: string}
    reference: {type: string, description: end card PNG at the video size}
    max_mad: {type: number, default: 2.0}
    from_end_s: {type: number, default: 0.0, description: 'compare the frame this many seconds before the end'}
  required: [video, reference]
  additionalProperties: false
returns:
  type: object
  properties:
    pass: {type: boolean}
    mean_abs_diff: {type: number}
    max_abs_diff: {type: number}
    pct_pixels_over_8: {type: number}
    heatmap: {type: string}
  required: [pass, mean_abs_diff, max_abs_diff]
dependencies: []
timeout_s: 120
resources: {max_memory_mb: 1024}
network: false
produces_files: true
tags: [qc, final-frame, exactness, lockup]
author: user
created_from_run: null
